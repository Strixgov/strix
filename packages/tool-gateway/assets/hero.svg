<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="@strixgov/tool-gateway — Local-first governed tool execution gateway">
  <defs>
    <pattern id="tg-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.025)"/>
    </pattern>
    <linearGradient id="tg-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#060B18"/>
  <rect width="1200" height="300" fill="url(#tg-grid)"/>
  <rect x="780" y="0" width="420" height="300" fill="url(#tg-fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" fill="#F0F4F8">
    <text x="56" y="78" font-size="14" fill="#7D8590" letter-spacing="2">npm i @strixgov/tool-gateway</text>
    <text x="56" y="140" font-size="44" font-weight="600">@strixgov/tool-gateway</text>
    <text x="56" y="184" font-size="20" fill="#B4C0CC">Local-first governed tool execution</text>
    <text x="56" y="212" font-size="20" fill="#B4C0CC">for AI agents. No Strix account required.</text>
    <g transform="translate(56,240)" font-size="12" fill="#7D8590">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="none" stroke="rgba(63,185,80,0.4)"/>
      <text x="43" y="17" text-anchor="middle" fill="#3FB950">v0.4.1</text>
      <text x="100" y="17">MIT · Velaris Group</text>
    </g>
  </g>

  <!-- Glyph: gate with two pillars + flowing token -->
  <g transform="translate(900,150)" fill="none" stroke-width="2">
    <!-- gate frame -->
    <path d="M-72 -64 L-72 64 M72 -64 L72 64 M-72 -64 L72 -64" stroke="#3FB950" stroke-opacity="0.85"/>
    <!-- inner rails -->
    <path d="M-54 -64 L-54 64 M54 -64 L54 64" stroke="#3FB950" stroke-opacity="0.4"/>
    <!-- token mid-passage -->
    <rect x="-18" y="-12" width="36" height="24" rx="4" stroke="#3FB950" fill="rgba(63,185,80,0.1)" stroke-width="2"/>
    <!-- motion lines -->
    <path d="M-100 -8 L-78 -8 M-100 0 L-78 0 M-100 8 L-78 8" stroke="#3FB950" stroke-opacity="0.45"/>
    <path d="M78 -8 L100 -8 M78 0 L100 0 M78 8 L100 8" stroke="#3FB950" stroke-opacity="0.45"/>
    <!-- base -->
    <line x1="-110" y1="80" x2="110" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text y="-78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#3FB950" stroke="none">GATEWAY</text>
  </g>
</svg>

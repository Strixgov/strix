<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Logo lockups</title></head>
<body><div class="card">
  <!-- Primary: mark + wordmark -->
  <div style="display:flex; gap:20px; align-items:center; padding:18px 22px; background:var(--bg-1); border:1px solid var(--border-1); border-radius:8px">
    <img src="./strix-logomark.svg" style="height:64px; width:auto; display:block"/>
    <div style="display:flex; flex-direction:column; gap:4px">
      <div style="font:900 26px/1 var(--font-sans); letter-spacing:0.08em; color:var(--fg-1)">STRIX</div>
      <div style="font:500 10px/1 var(--font-sans); letter-spacing:0.18em; text-transform:uppercase; color:var(--fg-3)">Execution control</div>
    </div>
  </div>

  <div style="display:flex; gap:14px; margin-top:14px">
    <!-- Stacked -->
    <div style="flex:1; padding:18px; background:var(--bg-1); border:1px solid var(--border-1); border-radius:8px; display:flex; flex-direction:column; align-items:center; gap:10px">
      <img src="./strix-logomark.svg" style="height:52px"/>
      <div style="font:900 16px/1 var(--font-sans); letter-spacing:0.08em">STRIX</div>
    </div>
    <!-- Wordmark alone -->
    <div style="flex:1; padding:18px; background:var(--bg-1); border:1px solid var(--border-1); border-radius:8px; display:flex; justify-content:center; align-items:center">
      <div style="font:900 24px/1 var(--font-sans); letter-spacing:0.08em">STRIX</div>
    </div>
    <!-- Mark on dark -->
    <div style="flex:1; padding:18px; background:#04080F; border-radius:8px; display:flex; justify-content:center; align-items:center">
      <img src="./strix-logomark.svg" style="height:52px"/>
    </div>
  </div>

  <div style="font:500 11px/1.5 var(--font-sans); color:var(--fg-3); margin-top:14px">
    Mark + wordmark · stacked · wordmark only · mark alone.
    Word-mark is Arial Black (weight 900), tracked <code style="font-family:var(--font-mono)">+0.08em</code>, all-caps.
    Mark color is baked cyan <code style="font-family:var(--font-mono)">#3BB5C9</code>; do not recolor.
  </div>
</div></body></html>

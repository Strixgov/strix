      <text x="43" y="17" text-anchor="middle" fill="#9D8DF1">v0.1.0</text>
      <text x="100" y="17">MIT · Velaris Group · drop-in for tool-gateway</text>
    </g>
  </g>

  <!-- Glyph: stacked classification rows -->
  <g transform="translate(820,80)" font-family="'JetBrains Mono',monospace" font-size="11" fill="#F0F4F8">
    <g transform="translate(0,0)">
      <rect width="320" height="28" rx="6" fill="#0C1425" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#3FB950"/>
      <text x="30" y="18">Read</text>
      <text x="240" y="18" fill="#7D8590">read · low</text>
    </g>
    <g transform="translate(0,36)">
      <rect width="320" height="28" rx="6" fill="#0C1425" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#3FB950"/>
      <text x="30" y="18">Grep</text>
      <text x="240" y="18" fill="#7D8590">read · low</text>
    </g>
    <g transform="translate(0,72)">
      <rect width="320" height="28" rx="6" fill="#0C1425" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#D29922"/>
      <text x="30" y="18">Edit</text>
      <text x="240" y="18" fill="#7D8590">write · med</text>
    </g>
    <g transform="translate(0,108)">
      <rect width="320" height="28" rx="6" fill="#0C1425" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="14" cy="14" r="4" fill="#D29922"/>
      <text x="30" y="18">Write</text>
      <text x="240" y="18" fill="#7D8590">write · med</text>

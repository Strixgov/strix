<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="@strixgov/capabilities-claude-code — Pre-classified capability registry for Claude Code">
  <defs>
    <pattern id="cc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.025)"/>
    </pattern>
    <linearGradient id="cc-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9D8DF1" stop-opacity="0"/>
      <stop offset="1" stop-color="#9D8DF1" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#060B18"/>
  <rect width="1200" height="300" fill="url(#cc-grid)"/>
  <rect x="780" y="0" width="420" height="300" fill="url(#cc-fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" fill="#F0F4F8">
    <text x="56" y="78" font-size="14" fill="#7D8590" letter-spacing="2">npm i @strixgov/capabilities-claude-code</text>
    <text x="56" y="138" font-size="36" font-weight="600">@strixgov/capabilities-claude-code</text>
    <text x="56" y="180" font-size="20" fill="#B4C0CC">Pre-classified capability registry for</text>
    <text x="56" y="208" font-size="20" fill="#B4C0CC">Claude Code's built-in tools.</text>
    <g transform="translate(56,234)" font-size="12" fill="#7D8590">

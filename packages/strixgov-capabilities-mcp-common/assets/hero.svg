<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="@strixgov/capabilities-mcp-common — Pre-classified capability registry for popular MCP servers">
  <defs>
    <pattern id="mc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.025)"/>
    </pattern>
    <linearGradient id="mc-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#060B18"/>
  <rect width="1200" height="300" fill="url(#mc-grid)"/>
  <rect x="780" y="0" width="420" height="300" fill="url(#mc-fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" fill="#F0F4F8">
    <text x="56" y="78" font-size="14" fill="#7D8590" letter-spacing="2">npm i @strixgov/capabilities-mcp-common</text>
    <text x="56" y="138" font-size="34" font-weight="600">@strixgov/capabilities-mcp-common</text>
    <text x="56" y="180" font-size="20" fill="#B4C0CC">Pre-classified registry for popular</text>
    <text x="56" y="208" font-size="20" fill="#B4C0CC">MCP servers — Slack, GitHub, Linear, Notion.</text>
    <g transform="translate(56,234)" font-size="12" fill="#7D8590">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="none" stroke="rgba(244,114,182,0.4)"/>
      <text x="43" y="17" text-anchor="middle" fill="#F472B6">v0.1.0</text>
      <text x="100" y="17">MIT · Velaris Group · drop-in for tool-gateway</text>
    </g>
  </g>

  <!-- Glyph: 2x2 server tile grid -->
  <g transform="translate(820,80)" font-family="'JetBrains Mono',monospace" font-size="11">
    <g transform="translate(0,0)">
      <rect width="150" height="68" rx="10" fill="#0C1425" stroke="rgba(244,114,182,0.45)"/>
      <text x="14" y="26" fill="#F0F4F8">Slack</text>
      <text x="14" y="50" fill="#7D8590">12 tools</text>
    </g>
    <g transform="translate(170,0)">
      <rect width="150" height="68" rx="10" fill="#0C1425" stroke="rgba(244,114,182,0.45)"/>
      <text x="14" y="26" fill="#F0F4F8">GitHub</text>
      <text x="14" y="50" fill="#7D8590">24 tools</text>
    </g>
    <g transform="translate(0,82)">
      <rect width="150" height="68" rx="10" fill="#0C1425" stroke="rgba(244,114,182,0.45)"/>
      <text x="14" y="26" fill="#F0F4F8">Linear</text>
      <text x="14" y="50" fill="#7D8590">9 tools</text>
    </g>
    <g transform="translate(170,82)">
      <rect width="150" height="68" rx="10" fill="#0C1425" stroke="rgba(244,114,182,0.45)"/>
      <text x="14" y="26" fill="#F0F4F8">Notion</text>
      <text x="14" y="50" fill="#7D8590">14 tools</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="@strixgov/mcp-adapter — One-call governance for any MCP server">
  <defs>
    <pattern id="ma-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.025)"/>
    </pattern>
    <linearGradient id="ma-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#060B18"/>
  <rect width="1200" height="300" fill="url(#ma-grid)"/>
  <rect x="780" y="0" width="420" height="300" fill="url(#ma-fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" fill="#F0F4F8">
    <text x="56" y="78" font-size="14" fill="#7D8590" letter-spacing="2">npm i @strixgov/mcp-adapter</text>
    <text x="56" y="140" font-size="44" font-weight="600">@strixgov/mcp-adapter</text>
    <text x="56" y="184" font-size="20" fill="#B4C0CC">One-call governance for any MCP server.</text>
    <text x="56" y="212" font-size="20" fill="#B4C0CC">Zero changes to tool implementations.</text>
    <g transform="translate(56,240)" font-size="12" fill="#7D8590">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="none" stroke="rgba(47,129,247,0.4)"/>
      <text x="43" y="17" text-anchor="middle" fill="#2F81F7">v0.1.0</text>
      <text x="100" y="17">MIT · Velaris Group · peer ≥ 0.4</text>
    </g>
  </g>

  <!-- Glyph: wrap arrow around node -->
  <g transform="translate(900,150)" fill="none" stroke="#2F81F7" stroke-width="2">
    <circle r="50" stroke-opacity="0.55"/>
    <path d="M-90 0 A 90 90 0 1 1 90 0" stroke-opacity="0.85"/>
    <path d="M90 0 L78 -10 M90 0 L78 10" stroke-opacity="0.85"/>
    <path d="M-90 0 L-78 -10 M-90 0 L-78 10" stroke-opacity="0.85"/>
    <!-- inner MCP icon -->
    <g stroke="#2F81F7" stroke-width="2">
      <rect x="-22" y="-22" width="44" height="44" rx="6" fill="rgba(47,129,247,0.08)"/>
      <line x1="-12" y1="-8" x2="12" y2="-8"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-12" y1="8" x2="12" y2="8"/>
    </g>
    <text y="-72" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#2F81F7" stroke="none">WRAP</text>
  </g>
</svg>

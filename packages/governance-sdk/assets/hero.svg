<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="@strixgov/sdk — Governed execution infrastructure SDK">
  <defs>
    <pattern id="sdk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <linearGradient id="sdk-accent-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00BCD4" stop-opacity="0"/>
      <stop offset="1" stop-color="#00BCD4" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="sdk-stroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#00BCD4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00BCD4" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#060B18"/>
  <rect width="1200" height="300" fill="url(#sdk-grid)"/>
  <rect x="780" y="0" width="420" height="300" fill="url(#sdk-accent-fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- Left column: name + tag -->
  <g font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" fill="#F0F4F8">
    <text x="56" y="78" font-size="14" fill="#7D8590" letter-spacing="2">npm i @strixgov/sdk</text>
    <text x="56" y="140" font-size="44" font-weight="600">@strixgov/sdk</text>
    <text x="56" y="184" font-size="20" fill="#B4C0CC">Governed execution infrastructure</text>
    <text x="56" y="212" font-size="20" fill="#B4C0CC">for irreversible actions.</text>
    <g transform="translate(56,240)" font-size="12" fill="#7D8590">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="none" stroke="rgba(0,188,212,0.4)"/>
      <text x="43" y="17" text-anchor="middle" fill="#00BCD4">v0.1.0</text>
      <text x="100" y="17">MIT · Velaris Group</text>
    </g>
  </g>

  <!-- Right column: glyph (Decision token sigil) -->
  <g transform="translate(900,150)" stroke="url(#sdk-stroke)" fill="none" stroke-width="1.5">
    <circle r="92" stroke-opacity="0.35"/>
    <circle r="64" stroke-opacity="0.55"/>
    <circle r="36" stroke-opacity="0.85"/>
    <!-- inner hex token -->
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" stroke="#00BCD4" stroke-width="2" fill="rgba(0,188,212,0.08)"/>
    <!-- four ticks at cardinal points -->
    <line x1="0" y1="-92" x2="0" y2="-78" stroke="#00BCD4" stroke-width="2"/>
    <line x1="92" y1="0" x2="78" y2="0" stroke="#00BCD4" stroke-width="2"/>
    <line x1="0" y1="92" x2="0" y2="78" stroke="#00BCD4" stroke-width="2"/>
    <line x1="-92" y1="0" x2="-78" y2="0" stroke="#00BCD4" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" fill="#00BCD4" stroke="none">SDK</text>
  </g>
</svg>
